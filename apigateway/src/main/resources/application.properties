spring.application.name=apigateway
server.port=8080
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.instance.preferIpAddress=true

# Order Service Route
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://ORDERSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**
#spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# User Service Route
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USERSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**
#spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Product Service Route
spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=lb://PRODUCTSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/products/**
#spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Debug logging
logging.level.org.springframework.cloud.gateway=DEBUG